name: CI

# PRD §12.6 — every PR: install → typecheck → lint → unit tests → build →
# Playwright + axe → Lighthouse CI. All must pass to merge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The scaffold ships a pre-existing oxlint/eslint-plugin-oxlint peer
      # mismatch; legacy resolution keeps CI reproducible until it is bumped.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E, accessibility, and responsive checks
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run build-only

      - name: Lighthouse CI (NFR2 budgets)
        run: npx --yes @lhci/cli@0.14.x autorun
