<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A screen showing a rising bar chart, with a target and two floating report cards around it">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3EC"/>
      <stop offset="100%" stop-color="#FDEFE6"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C1A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1C1C1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>

  <!-- contact shadow under the whole group -->
  <ellipse cx="800" cy="880" rx="470" ry="56" fill="url(#pool)"/>

  <!-- ── Monitor ─────────────────────────────────────────────────────── -->
  <!-- stand -->
  <path d="M735 760h130l26 86H709z" fill="#3A3A36"/>
  <rect x="640" y="846" width="320" height="34" rx="17" fill="#2A2A27"/>
  <rect x="640" y="846" width="320" height="18" rx="9" fill="#46463F"/>

  <!-- bezel: dark slab with a lit top face -->
  <rect x="430" y="214" width="740" height="556" rx="34" fill="#2A2A27"/>
  <rect x="430" y="214" width="740" height="540" rx="34" fill="#3A3A36"/>
  <rect x="462" y="246" width="676" height="462" rx="18" fill="#FFFFFF"/>

  <!-- chart baseline -->
  <rect x="506" y="648" width="588" height="6" rx="3" fill="#E6E5E2"/>

  <!-- Rising trend, drawn BEFORE the bars so they occlude it: the line reads as
       passing behind the chart rather than being pasted over it. -->
  <path d="M520 612 L676 512 L812 556 L1004 322"
        fill="none" stroke="#F26522" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M934 316 L1030 292 L1016 390 Z" fill="#F26522"/>

  <!-- bars, each with a darker right face for depth -->
  <g>
    <rect x="536" y="520" width="78" height="128" rx="10" fill="#2FA98C"/>
    <rect x="596" y="520" width="18" height="128" rx="9" fill="#23856E"/>

    <rect x="650" y="454" width="78" height="194" rx="10" fill="#F26522"/>
    <rect x="710" y="454" width="18" height="194" rx="9" fill="#C0521C"/>

    <rect x="764" y="382" width="78" height="266" rx="10" fill="#2FA98C"/>
    <rect x="824" y="382" width="18" height="266" rx="9" fill="#23856E"/>

    <rect x="878" y="330" width="78" height="318" rx="10" fill="#F26522"/>
    <rect x="938" y="330" width="18" height="318" rx="9" fill="#C0521C"/>

    <rect x="992" y="286" width="78" height="362" rx="10" fill="#1C1C1A"/>
    <rect x="1052" y="286" width="18" height="362" rx="9" fill="#000000" opacity="0.45"/>
  </g>

  <!-- ── Target, top left ────────────────────────────────────────────── -->
  <g>
    <circle cx="316" cy="300" r="132" fill="#D0503F"/>
    <circle cx="316" cy="300" r="132" fill="#1C1C1A" opacity="0.14"/>
    <circle cx="308" cy="292" r="132" fill="#E56A55"/>
    <circle cx="308" cy="292" r="92" fill="#FFF7F4"/>
    <circle cx="308" cy="292" r="52" fill="#E56A55"/>
    <circle cx="308" cy="292" r="18" fill="#FFF7F4"/>
    <!-- arrow through the centre -->
    <path d="M308 292 L176 160" stroke="#2A2A27" stroke-width="20" stroke-linecap="round"/>
    <path d="M150 134 L214 150 L198 198 Z" fill="#F26522"/>
    <path d="M150 134 L134 198 L182 214 Z" fill="#C0521C"/>
  </g>

  <!-- ── Floating report card, top right ─────────────────────────────── -->
  <g>
    <rect x="1096" y="156" width="372" height="252" rx="22" fill="#2A2A27"/>
    <rect x="1096" y="156" width="372" height="240" rx="22" fill="#FFFFFF"/>
    <rect x="1096" y="156" width="372" height="48" rx="22" fill="#F26522"/>
    <rect x="1096" y="186" width="372" height="18" fill="#F26522"/>
    <circle cx="1130" cy="180" r="9" fill="#FFF7F4"/>
    <circle cx="1160" cy="180" r="9" fill="#FFD9C4"/>
    <circle cx="1190" cy="180" r="9" fill="#FFF7F4"/>
    <rect x="1134" y="296" width="52" height="68" rx="8" fill="#2FA98C"/>
    <rect x="1206" y="258" width="52" height="106" rx="8" fill="#1C1C1A"/>
    <rect x="1278" y="282" width="52" height="82" rx="8" fill="#F26522"/>
    <rect x="1350" y="238" width="52" height="126" rx="8" fill="#2FA98C"/>
  </g>

  <!-- ── Floating report card, bottom left ───────────────────────────── -->
  <g>
    <rect x="186" y="552" width="330" height="228" rx="20" fill="#2A2A27"/>
    <rect x="186" y="552" width="330" height="216" rx="20" fill="#FFFFFF"/>
    <rect x="186" y="552" width="330" height="44" rx="20" fill="#1C1C1A"/>
    <rect x="186" y="578" width="330" height="18" fill="#1C1C1A"/>
    <circle cx="218" cy="574" r="8" fill="#F26522"/>
    <circle cx="246" cy="574" r="8" fill="#2FA98C"/>
    <rect x="222" y="662" width="44" height="74" rx="7" fill="#F26522"/>
    <rect x="286" y="690" width="44" height="46" rx="7" fill="#E6E5E2"/>
    <rect x="350" y="640" width="44" height="96" rx="7" fill="#2FA98C"/>
    <rect x="414" y="676" width="44" height="60" rx="7" fill="#E6E5E2"/>
  </g>

  <!-- ── Filed-document stack, bottom right ──────────────────────────── -->
  <g>
    <rect x="1256" y="700" width="196" height="150" rx="16" fill="#E0DFDB"/>
    <rect x="1240" y="676" width="196" height="150" rx="16" fill="#EFEEEB"/>
    <rect x="1224" y="652" width="196" height="150" rx="16" fill="#FFFFFF"/>
    <rect x="1224" y="652" width="196" height="150" rx="16" fill="none" stroke="#E6E5E2" stroke-width="3"/>
    <rect x="1254" y="688" width="136" height="12" rx="6" fill="#E6E5E2"/>
    <rect x="1254" y="718" width="104" height="12" rx="6" fill="#E6E5E2"/>
    <rect x="1254" y="748" width="120" height="12" rx="6" fill="#E6E5E2"/>
    <circle cx="1420" cy="652" r="34" fill="#2FA98C"/>
    <path d="M1405 652 l11 12 20 -23" fill="none" stroke="#FFFFFF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
