<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Two streams, machine and person, merging into one rising arrow above a stepped chart">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3EC"/>
      <stop offset="100%" stop-color="#FDEFE6"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C1A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1C1C1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <ellipse cx="800" cy="884" rx="470" ry="54" fill="url(#pool)"/>

  <!-- ── Two streams merging ─────────────────────────────────────────── -->
  <path d="M250 300 C 470 300, 520 470, 760 470" fill="none" stroke="#2FA98C" stroke-width="30" stroke-linecap="round"/>
  <path d="M250 640 C 470 640, 520 470, 760 470" fill="none" stroke="#F26522" stroke-width="30" stroke-linecap="round"/>
  <path d="M760 470 L1130 470" fill="none" stroke="#1C1C1A" stroke-width="40" stroke-linecap="round"/>
  <path d="M1110 404 L1230 470 L1110 536 Z" fill="#1C1C1A"/>

  <!-- the machine side -->
  <g>
    <rect x="96" y="214" width="250" height="180" rx="24" fill="#23856E"/>
    <rect x="96" y="214" width="250" height="168" rx="24" fill="#2FA98C"/>
    <rect x="140" y="258" width="162" height="80" rx="14" fill="#FFFFFF"/>
    <g fill="#2FA98C">
      <rect x="158" y="276" width="34" height="44" rx="7"/>
      <rect x="204" y="290" width="34" height="30" rx="7"/>
      <rect x="250" y="268" width="34" height="52" rx="7"/>
    </g>
  </g>

  <!-- the person side -->
  <g>
    <rect x="96" y="554" width="250" height="180" rx="24" fill="#C0521C"/>
    <rect x="96" y="554" width="250" height="168" rx="24" fill="#F26522"/>
    <circle cx="221" cy="616" r="34" fill="#FFF7F4"/>
    <path d="M161 702 a60 56 0 0 1 120 0 Z" fill="#FFF7F4"/>
  </g>

  <!-- where they meet -->
  <circle cx="760" cy="470" r="66" fill="#1C1C1A"/>
  <circle cx="752" cy="462" r="66" fill="#32322F"/>
  <path d="M722 462 l20 22 38 -44" fill="none" stroke="#2FA98C" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── What it adds up to ──────────────────────────────────────────── -->
  <g>
    <rect x="1020" y="596" width="420" height="268" rx="26" fill="#2A2A27"/>
    <rect x="1020" y="596" width="420" height="256" rx="26" fill="#FFFFFF"/>
    <rect x="1020" y="596" width="420" height="52" rx="26" fill="#1C1C1A"/>
    <rect x="1020" y="622" width="420" height="26" fill="#1C1C1A"/>
    <circle cx="1052" cy="620" r="9" fill="#F26522"/>
    <circle cx="1082" cy="620" r="9" fill="#2FA98C"/>
    <rect x="1060" y="760" width="62" height="56" rx="10" fill="#E6E5E2"/>
    <rect x="1148" y="724" width="62" height="92" rx="10" fill="#2FA98C"/>
    <rect x="1236" y="692" width="62" height="124" rx="10" fill="#F26522"/>
    <rect x="1324" y="660" width="62" height="156" rx="10" fill="#1C1C1A"/>
  </g>

  <!-- ── Badge ───────────────────────────────────────────────────────── -->
  <g>
    <rect x="1244" y="186" width="268" height="152" rx="24" fill="#2A2A27"/>
    <rect x="1244" y="186" width="268" height="140" rx="24" fill="#FFFFFF"/>
    <circle cx="1314" cy="256" r="34" fill="#FFF0E8"/>
    <path d="M1300 256 l11 12 20 -24" fill="none" stroke="#F26522" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1368" y="234" width="112" height="14" rx="7" fill="#E6E5E2"/>
    <rect x="1368" y="266" width="76" height="14" rx="7" fill="#E6E5E2"/>
  </g>
</svg>
